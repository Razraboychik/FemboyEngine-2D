# FemboyEngine2D - third-party notice manifest.
#
# Single source of truth for shipped attribution. `Documentation/Tools/
# GenerateThirdPartyNotices.py` turns this file into THIRD_PARTY_NOTICES.md and
# the embedded Fby::Notices table. Every component that ends up in a shipped
# binary must have an entry here; the notices test fails otherwise.
#
# license_file is relative to the repository root. When the file is absent the
# component is still listed with its SPDX identifier and upstream URL.

