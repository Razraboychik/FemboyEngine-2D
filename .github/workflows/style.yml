name: Style gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CheckStyle
        run: python Source/Tools/Dev/CheckStyle.py
      - name: Third-party notices
        run: python Documentation/Tools/GenerateThirdPartyNotices.py --check
      - name: Documentation set
        run: python Documentation/Tools/CheckDocs.py
