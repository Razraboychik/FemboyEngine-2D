name: Build gate (compiler bring-up)

# The authoritative Windows gate is the ci-clangcl preset: RelWithDebInfo,
# clang-cl 23.1.4, the full test suite, and a red run blocks the change. The
# Linux jobs are the second opinion and stay advisory until both runners are
# green on a hosted runner.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

env:
  LLVM_VERSION: "23.1.4"
  SDL_AUDIODRIVER: dummy

jobs:
  windows-clang-cl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        shell: pwsh
        run: |
          $Installer = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_VERSION-win64.msi"
          $Url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.msi"
          Invoke-WebRequest -UseBasicParsing -Uri $Url -OutFile $Installer
          $Process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i", "`"$Installer`"", "/qn", "/norestart", "ALLUSERS=1"
          )
          if ($Process.ExitCode -ne 0) { throw "LLVM installer failed with exit code $($Process.ExitCode)" }
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify LLVM ${{ env.LLVM_VERSION }}
        shell: pwsh
        run: |
          $Clang = (Get-Command clang-cl).Source
          if ($Clang -notlike "C:\Program Files\LLVM\bin\*") {
            throw "Expected clang-cl from LLVM 23.1.4, got: $Clang"
          }
          $Version = (& $Clang --version | Select-Object -First 1)
          if ($Version -notmatch [regex]::Escape($env:LLVM_VERSION)) {
            throw "Expected LLVM $env:LLVM_VERSION, got: $Version"
          }
          $Version
      - name: Configure
        run: cmake --preset ci-clangcl
      - name: Dependency lock
        run: python Source/Tools/Dev/CheckDependencyLock.py --build build-ci --require
      - name: Build
        run: cmake --build --preset ci-clangcl
      - name: Pak reproducibility
        run: python Source/Tools/Dev/CheckPakReproducible.py --tool build-ci/bin/tools/fby_fempak.exe
      - name: Release checklist
        run: python Source/Tools/Dev/ReleaseChecklist.py --artifacts build-ci/bin --artifacts build-ci/bin/tools --require fby_editor.exe --require fby_fempak.exe --forbid Documentation/FEATURE_NOTES.md --version 0.3.0-alpha.1 --out build-ci/release-manifest.json
      - name: Test
        run: ctest --preset ci-clangcl --output-on-failure --timeout 60 -E "mesh_indirect_smoke|accessibility_composite|settings"

  linux-clang:
    env:
      SDL_VIDEODRIVER: x11
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-llvm
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build git python3 libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxss-dev libxtst-dev libxfixes-dev libxrender-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libfribidi-dev libthai-dev libusb-1.0-0-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFBY_BUILD_EDITOR=ON -DFBY_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 8 -- -k 0
      - name: Pak reproducibility
        run: python Source/Tools/Dev/CheckPakReproducible.py --tool build/bin/tools/fby_fempak
      - name: Release checklist
        run: python Source/Tools/Dev/ReleaseChecklist.py --artifacts build/bin --artifacts build/bin/tools --require fby_editor --require fby_fempak --forbid Documentation/FEATURE_NOTES.md --version 0.3.0-alpha.1 --out build/release-manifest.json
      - name: Test
        run: xvfb-run -a ctest --test-dir build --output-on-failure

  linux-gcc:
    env:
      SDL_VIDEODRIVER: x11
    runs-on: ubuntu-latest
    container: gcc:16
    continue-on-error: true
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          apt-get install -y cmake ninja-build python3 python-is-python3 libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxss-dev libxtst-dev libxfixes-dev libxrender-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libfribidi-dev libthai-dev libusb-1.0-0-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools
          gcc --version | head -n1
          g++ --version | head -n1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFBY_BUILD_EDITOR=OFF -DFBY_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 8 -- -k 0
      - name: Pak reproducibility
        run: python Source/Tools/Dev/CheckPakReproducible.py --tool build/bin/tools/fby_fempak
      - name: Test
        run: xvfb-run -a ctest --test-dir build --output-on-failure

  reproducible:
    env:
      SDL_VIDEODRIVER: x11
    # Two independent builds of the same revision must cook identical archives.
    # Soft until a green run has been observed on the runner.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-llvm
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build git python3 libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxss-dev libxtst-dev libxfixes-dev libxrender-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libfribidi-dev libthai-dev libusb-1.0-0-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Configure first
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFBY_BUILD_EDITOR=OFF -DFBY_BUILD_TESTS=OFF
      - name: Build first
        run: cmake --build build --target fby_fempak --parallel 8 -- -k 0
      - name: Configure second
        run: cmake -S . -B build-repro -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFBY_BUILD_EDITOR=OFF -DFBY_BUILD_TESTS=OFF
      - name: Build second
        run: cmake --build build-repro --target fby_fempak --parallel 8 -- -k 0
      - name: Compare cooked archives
        run: python Source/Tools/Dev/ComparePakAcrossBuilds.py --first build/bin/tools/fby_fempak --second build-repro/bin/tools/fby_fempak --workdir build

  linux-asan:
    env:
      SDL_VIDEODRIVER: x11
    # Hard gate: AddressSanitizer plus LeakSanitizer on the text stack. A leak
    # or a use-after-free fails the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-llvm
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build git python3 libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxss-dev libxtst-dev libxfixes-dev libxrender-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libfribidi-dev libthai-dev libusb-1.0-0-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Configure
        run: cmake -S . -B build-asan -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFBY_BUILD_EDITOR=OFF -DFBY_BUILD_TESTS=ON -DFBY_WITH_ASAN=ON
      - name: Build
        run: cmake --build build-asan --parallel 8 -- -k 0
      - name: Text stack under ASan and LSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:allocator_may_return_null=1
          LSAN_OPTIONS: detect_leaks=1:report_objects=1
        run: xvfb-run -a ctest --test-dir build-asan --output-on-failure --timeout 300 -R "^(bigint|decimal|script_bigint|text|text_render|text_format|text_markup|text_asset_format|text_asset_file|font_builder|text_shaper|text_shape_cache|text_shape_system|font_paging|text_coverage|text_hot_path|text_golden|fuzz_parsers|fuzz_noise|notices|definitions|logboy)$"
      - name: Full suite under ASan and LSan
        continue-on-error: true
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:allocator_may_return_null=1
          LSAN_OPTIONS: detect_leaks=1:report_objects=1
        run: xvfb-run -a ctest --test-dir build-asan --output-on-failure --timeout 300

  linux-ubsan:
    env:
      SDL_VIDEODRIVER: x11
    # UndefinedBehaviorSanitizer with -fno-sanitize-recover=all: the first
    # undefined operation aborts. Covers the parsers and the text stack.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-llvm
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build git python3 libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxss-dev libxtst-dev libxfixes-dev libxrender-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libfribidi-dev libthai-dev libusb-1.0-0-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Configure
        run: cmake -S . -B build-ubsan -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFBY_BUILD_EDITOR=OFF -DFBY_BUILD_TESTS=ON -DFBY_WITH_UBSAN=ON
      - name: Build
        run: cmake --build build-ubsan --parallel 8 -- -k 0
      - name: Parsers, text and core under UBSan
        run: xvfb-run -a ctest --test-dir build-ubsan --output-on-failure --timeout 300 -R "^(fuzz_parsers|fuzz_noise|bigint|decimal|script_bigint|text|text_render|text_format|text_markup|text_asset_format|text_asset_file|font_builder|text_shaper|text_shape_cache|text_shape_system|font_paging|text_coverage|text_hot_path|text_golden)$"

  windows-asan:
    # Windows has no LeakSanitizer, so this job proves the memory errors and
    # keeps detect_leaks=0 explicit instead of silent.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build-asan -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFBY_BUILD_EDITOR=OFF -DFBY_BUILD_TESTS=ON -DFBY_WITH_ASAN=ON
      - name: Build
        run: cmake --build build-asan --parallel 8 -- -k 0
      - name: Text stack under ASan
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:allocator_may_return_null=1
        run: ctest --test-dir build-asan --output-on-failure --timeout 300 -R "^(bigint|decimal|script_bigint|text|text_render|text_format|text_markup|text_asset_format|text_asset_file|font_builder|text_shaper|text_shape_cache|text_shape_system|font_paging|text_coverage|text_hot_path|text_golden|fuzz_parsers|fuzz_noise|notices|definitions|logboy)$"

  macos-clang:
    env:
      SDL_VIDEODRIVER: dummy
    # Advisory until the first green hosted run. It builds the editor, tools and
    # game packer with the Metal RHI, then runs the non-GPU test scope.
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: brew install cmake ninja
      - name: Configure
        run: cmake --preset macos-release
      - name: Build
        run: cmake --build --preset macos-release -- -k 0
      - name: Pak reproducibility
        run: python Source/Tools/Dev/CheckPakReproducible.py --tool build-macos-release/bin/tools/fby_fempak
      - name: Release checklist
        run: python Source/Tools/Dev/ReleaseChecklist.py --artifacts build-macos-release/bin --artifacts build-macos-release/bin/tools --require fby_editor --require fby_fempak --forbid Documentation/FEATURE_NOTES.md --version 0.3.0-alpha.1 --out build-macos-release/release-manifest.json
      - name: Test
        run: ctest --preset macos-release --output-on-failure --timeout 120 -E "mesh_indirect_smoke|accessibility_composite|settings"
