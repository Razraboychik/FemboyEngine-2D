name: Build gate (compiler bring-up)

# Push and pull-request runs are mandatory. Windows clang-cl, Linux clang,
# Linux GCC and the full ASan/LSan suite must stay green; the remaining
# platform jobs are advisory while their hosted runners are being stabilized.

on:
  push:
    branches: [ main, master, v0.5.0alpha.1 ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

env:
  LLVM_VERSION: "23.1.4"
  SDL_AUDIODRIVER: dummy

jobs:
  windows-clang-cl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        shell: pwsh
        run: |
          $Installer = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_VERSION-win64.msi"
          $Url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.msi"
          Invoke-WebRequest -UseBasicParsing -Uri $Url -OutFile $Installer
          $Process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i", "`"$Installer`"", "/qn", "/norestart", "ALLUSERS=1"
          )
          if ($Process.ExitCode -ne 0) { throw "LLVM installer failed with exit code $($Process.ExitCode)" }
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify LLVM ${{ env.LLVM_VERSION }}
        shell: pwsh
        run: |
          $Clang = (Get-Command clang-cl).Source
          if ($Clang -notlike "C:\Program Files\LLVM\bin\*") {
            throw "Expected clang-cl from LLVM 23.1.4, got: $Clang"
          }
          $Version = (& $Clang --version | Select-Object -First 1)
          if ($Version -notmatch [regex]::Escape($env:LLVM_VERSION)) {
            throw "Expected LLVM $env:LLVM_VERSION, got: $Version"
          }
          $Version
      - name: Configure
        run: cmake --preset ci-clangcl
      - name: Dependency lock
        run: python Source/Tools/Dev/CheckDependencyLock.py --build build-ci --require
      - name: Build
        run: |
          cmake --build --preset ci-clangcl 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE
      - name: Build errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log build.log
      - name: Pak reproducibility
        run: python Source/Tools/Dev/CheckPakReproducible.py --tool build-ci/bin/tools/fby_fempak.exe
      - name: Release checklist
        run: python Source/Tools/Dev/ReleaseChecklist.py --artifacts build-ci/bin --artifacts build-ci/bin/tools --require fby_editor.exe --require fby_fempak.exe --forbid Documentation/FEATURE_NOTES.md --out build-ci/release-manifest.json
      - name: Desktop package
        run: python Source/Tools/Dev/PackageDesktop.py --platform windows --preset ci-clangcl --build-dir build-ci --output build/package --skip-build
      - name: Vendor usage report
        run: python Source/Tools/Dev/ReportVendorUsage.py --build build-ci --output build-ci/vendor-usage.md --strict
      - name: Test
        # Hardware smoke tests need a display and an adapter; they run in the
        # advisory step below and must not gate the headless compiler job.
        run: |
          ctest --preset ci-clangcl --output-on-failure --timeout 60 -E "mesh_indirect_smoke|accessibility_composite|settings|d3d12_rhi|d3d11_rhi|d3d11_rhi_fl10|auto_backend|system_info|fsr2_dx|frame_composer_dx|custom_fg_dx|fby_fsr2_dx_d3d11|fby_custom_fg_d3d11|fby_frame_composer_dx_d3d11|material_dx12_e2e|vulkan_rhi|fby_vulkan_rhi_legacy_1_2|frame_composer_benchmark" 2>&1 | Tee-Object -FilePath test.log
          exit $LASTEXITCODE
      - name: Test errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log test.log
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-clang-cl-test-log
          path: test.log
          if-no-files-found: ignore
      - name: Hardware smoke (advisory)
        # The hosted runner has no display or GPU adapter. These smoke tests run
        # on real hardware locally; here they are executed and reported, but they
        # do not gate the compiler bring-up job.
        continue-on-error: true
        run: |
          ctest --preset ci-clangcl --output-on-failure --timeout 120 -R "d3d12_rhi|d3d11_rhi|d3d11_rhi_fl10|auto_backend|system_info|fsr2_dx|frame_composer_dx|custom_fg_dx|fby_fsr2_dx_d3d11|fby_custom_fg_d3d11|fby_frame_composer_dx_d3d11|material_dx12_e2e|vulkan_rhi|fby_vulkan_rhi_legacy_1_2|frame_composer_benchmark" 2>&1 | Tee-Object -FilePath hardware.log
          exit $LASTEXITCODE
      - name: Hardware smoke report
        if: always()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log hardware.log

  windows-msvc:
    # First-class Microsoft compiler gate. The hosted runner already ships
    # Visual Studio, so setup scripts never need to download MSVC.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build-msvc -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFBY_BUILD_EDITOR=ON -DFBY_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-msvc --parallel 8 -- -k 0 2>&1 | Tee-Object -FilePath build-msvc.log
      - name: Build errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log build-msvc.log
      - name: Test
        run: ctest --test-dir build-msvc --output-on-failure --timeout 60 -E "mesh_indirect_smoke|accessibility_composite|settings|d3d12_rhi|d3d11_rhi|d3d11_rhi_fl10|auto_backend|system_info|fsr2_dx|frame_composer_dx|custom_fg_dx|fby_fsr2_dx_d3d11|fby_custom_fg_d3d11|fby_frame_composer_dx_d3d11|material_dx12_e2e|vulkan_rhi|fby_vulkan_rhi_legacy_1_2|frame_composer_benchmark" 2>&1 | Tee-Object -FilePath test-msvc.log
      - name: Test errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log test-msvc.log
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-test-log
          path: test-msvc.log
          if-no-files-found: ignore

  linux-clang:
    env:
      SDL_VIDEODRIVER: x11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-llvm
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build git python3 libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxss-dev libxtst-dev libxfixes-dev libxrender-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libfribidi-dev libthai-dev libusb-1.0-0-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev speech-dispatcher xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFBY_BUILD_EDITOR=ON -DFBY_BUILD_TESTS=ON
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 8 -- -k 0 2>&1 | tee build.log
      - name: Build errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log build.log
      - name: Pak reproducibility
        run: python Source/Tools/Dev/CheckPakReproducible.py --tool build/bin/tools/fby_fempak
      - name: Release checklist
        run: python Source/Tools/Dev/ReleaseChecklist.py --artifacts build/bin --artifacts build/bin/tools --require fby_editor --require fby_fempak --forbid Documentation/FEATURE_NOTES.md --out build/release-manifest.json
      - name: Desktop package
        run: python Source/Tools/Dev/PackageDesktop.py --platform linux --build-dir build --output build/package --skip-build
      - name: Test
        run: |
          set -o pipefail
          xvfb-run -a ctest --test-dir build --output-on-failure 2>&1 | tee test.log
      - name: Test errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log test.log
      - name: Vulkan validation
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_DUPLICATE_MESSAGE_LIMIT: "100"
        run: |
          set -o pipefail
          xvfb-run -a ctest --test-dir build --output-on-failure -R "mesh_indirect_smoke|accessibility_composite|static_bake" 2>&1 | tee /tmp/vulkan-validation.log
          if grep -E "VUID-|Validation Error" /tmp/vulkan-validation.log; then
            echo "Vulkan validation reported an error"
            exit 1
          fi

  linux-gcc:
    env:
      SDL_VIDEODRIVER: x11
    runs-on: ubuntu-latest
    container: gcc:16.2
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          apt-get install -y cmake ninja-build python3 python-is-python3 libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxss-dev libxtst-dev libxfixes-dev libxrender-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libfribidi-dev libthai-dev libusb-1.0-0-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev speech-dispatcher xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools
          gcc --version | head -n1
          g++ --version | head -n1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFBY_BUILD_EDITOR=OFF -DFBY_BUILD_TESTS=ON
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 8 -- -k 0 2>&1 | tee build.log
      - name: Build errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log build.log
      - name: Pak reproducibility
        run: python Source/Tools/Dev/CheckPakReproducible.py --tool build/bin/tools/fby_fempak
      - name: Test
        run: |
          set -o pipefail
          xvfb-run -a ctest --test-dir build --output-on-failure 2>&1 | tee test.log
      - name: Test errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log test.log

  reproducible:
    env:
      SDL_VIDEODRIVER: x11
    # Two independent builds of the same revision must cook identical archives.
    # Soft until a green run has been observed on the runner.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-llvm
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build git python3 libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxss-dev libxtst-dev libxfixes-dev libxrender-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libfribidi-dev libthai-dev libusb-1.0-0-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Configure first
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFBY_BUILD_EDITOR=OFF -DFBY_BUILD_TESTS=OFF
      - name: Build first
        run: cmake --build build --target fby_fempak --parallel 8 -- -k 0
      - name: Configure second
        run: cmake -S . -B build-repro -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFBY_BUILD_EDITOR=OFF -DFBY_BUILD_TESTS=OFF
      - name: Build second
        run: cmake --build build-repro --target fby_fempak --parallel 8 -- -k 0
      - name: Compare cooked archives
        run: python Source/Tools/Dev/ComparePakAcrossBuilds.py --first build/bin/tools/fby_fempak --second build-repro/bin/tools/fby_fempak --workdir build

  linux-asan:
    env:
      SDL_VIDEODRIVER: x11
    # Hard gate: AddressSanitizer plus LeakSanitizer on the text stack. A leak
    # or a use-after-free fails the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-llvm
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build git python3 libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxss-dev libxtst-dev libxfixes-dev libxrender-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libfribidi-dev libthai-dev libusb-1.0-0-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Configure
        run: cmake -S . -B build-asan -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFBY_BUILD_EDITOR=OFF -DFBY_BUILD_TESTS=ON -DFBY_WITH_ASAN=ON
      - name: Build
        run: |
          set -o pipefail
          cmake --build build-asan --parallel 8 -- -k 0 2>&1 | tee build.log
      - name: Build errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log build.log
      - name: Text stack under ASan and LSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:allocator_may_return_null=1
          LSAN_OPTIONS: detect_leaks=1:report_objects=1:suppressions=${{ github.workspace }}/Source/Tools/Dev/lsan.supp
        run: |
          set -o pipefail
          xvfb-run -a ctest --test-dir build-asan --output-on-failure --timeout 300 -R "^(bigint|decimal|script_bigint|text|text_render|text_format|text_markup|text_asset_format|text_asset_file|font_builder|text_shaper|text_shape_cache|text_shape_system|font_paging|text_coverage|text_hot_path|text_golden|fuzz_parsers|fuzz_noise|notices|definitions|logboy)$" 2>&1 | tee test.log
      - name: Test errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log test.log
      - name: Full suite under ASan and LSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:allocator_may_return_null=1
          LSAN_OPTIONS: detect_leaks=1:report_objects=1:suppressions=${{ github.workspace }}/Source/Tools/Dev/lsan.supp
        run: |
          set -o pipefail
          xvfb-run -a ctest --test-dir build-asan --output-on-failure --timeout 300 2>&1 | tee test.log
      - name: Test errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log test.log

  linux-ubsan:
    env:
      SDL_VIDEODRIVER: x11
    # UndefinedBehaviorSanitizer with -fno-sanitize-recover=all: the first
    # undefined operation aborts. Covers the parsers and the text stack.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-llvm
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build git python3 libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxss-dev libxtst-dev libxfixes-dev libxrender-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libfribidi-dev libthai-dev libusb-1.0-0-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Configure
        run: cmake -S . -B build-ubsan -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFBY_BUILD_EDITOR=OFF -DFBY_BUILD_TESTS=ON -DFBY_WITH_UBSAN=ON
      - name: Build
        run: |
          set -o pipefail
          cmake --build build-ubsan --parallel 8 -- -k 0 2>&1 | tee build.log
      - name: Build errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log build.log
      - name: Parsers, text and core under UBSan
        run: |
          set -o pipefail
          xvfb-run -a ctest --test-dir build-ubsan --output-on-failure --timeout 300 -R "^(fuzz_parsers|fuzz_noise|bigint|decimal|script_bigint|text|text_render|text_format|text_markup|text_asset_format|text_asset_file|font_builder|text_shaper|text_shape_cache|text_shape_system|font_paging|text_coverage|text_hot_path|text_golden)$" 2>&1 | tee test.log
      - name: Test errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log test.log

  windows-asan:
    # Windows has no LeakSanitizer, so this job proves the memory errors and
    # keeps detect_leaks=0 explicit instead of silent.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        shell: pwsh
        run: |
          $Installer = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_VERSION-win64.msi"
          $Url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.msi"
          Invoke-WebRequest -UseBasicParsing -Uri $Url -OutFile $Installer
          $Process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i", "`"$Installer`"", "/qn", "/norestart", "ALLUSERS=1"
          )
          if ($Process.ExitCode -ne 0) { throw "LLVM installer failed with exit code $($Process.ExitCode)" }
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build-asan -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFBY_BUILD_EDITOR=OFF -DFBY_BUILD_TESTS=ON -DFBY_WITH_ASAN=ON
      - name: Build
        run: |
          cmake --build build-asan --parallel 8 -- -k 0 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE
      - name: Build errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log build.log
      - name: Text stack under ASan
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:allocator_may_return_null=1
        run: |
          ctest --test-dir build-asan --output-on-failure --timeout 300 -R "^(bigint|decimal|script_bigint|text|text_render|text_format|text_markup|text_asset_format|text_asset_file|font_builder|text_shaper|text_shape_cache|text_shape_system|font_paging|text_coverage|text_hot_path|text_golden|fuzz_parsers|fuzz_noise|notices|definitions|logboy)$" 2>&1 | Tee-Object -FilePath test.log
          exit $LASTEXITCODE
      - name: Test errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log test.log

  macos-clang:
    env:
      SDL_VIDEODRIVER: dummy
    # Advisory until the first green hosted run. It builds the editor, tools and
    # game packer with the Metal RHI, then runs the non-GPU test scope.
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: brew install cmake ninja llvm
      - name: Configure
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          cmake --preset macos-release             -DCMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang"             -DCMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++"
      - name: Build editor, tools and core tests
        run: |
          set -o pipefail
          cmake --build --preset macos-release --target fby_editor_app fby_sandbox fby_fempak fby_scene_tool fby_aotc fby_editor_infrastructure_test fby_frame_composer_test fby_input_system_test fby_release_cooker_test fby_project_bundle_test fby_text_shaper_test -- -k 0 2>&1 | tee build.log
      - name: Build errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log build.log
      - name: Pak reproducibility
        run: python Source/Tools/Dev/CheckPakReproducible.py --tool build-macos-release/bin/tools/fby_fempak
      - name: Release checklist
        run: python Source/Tools/Dev/ReleaseChecklist.py --artifacts build-macos-release/bin --artifacts build-macos-release/bin/tools --require fby_editor --require fby_fempak --forbid Documentation/FEATURE_NOTES.md --out build-macos-release/release-manifest.json
      - name: Desktop package
        run: python Source/Tools/Dev/PackageDesktop.py --platform macos --build-dir build-macos-release --output build-macos-release/package --skip-build
      - name: Test
        # Hosted macOS CPU timing and loopback UDP are noisy; the full suite is
        # the Windows/Linux gate. This run covers the editor, input, text,
        # frame-composer and release-cooker seams on macOS.
        run: |
          set -o pipefail
          ctest --preset macos-release --output-on-failure --timeout 120 --repeat until-pass:2 -R "^(project_bundle|editor_infrastructure|frame_composer|input_system|release_cooker|text_shaper)$" 2>&1 | tee test.log
      - name: Test errors
        if: failure()
        run: python Source/Tools/Dev/AnnotateBuildErrors.py --log test.log
