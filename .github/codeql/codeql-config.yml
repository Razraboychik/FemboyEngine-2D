# CodeQL configuration for FemboyEngine2D.
#
# This file is read by advanced setup and by the github-codeql-config-file
# repository property. Default setup does NOT read it automatically.
#
# Keep third_party/** visible by default. Only generated copies, upstream tests
# and demo/tool programs that the engine never links are excluded. If one of
# these files becomes a real build input, remove its pattern and triage it.
name: FemboyEngine2D
paths-ignore:
  - third_party/miniaudio-master/miniaudio-master/extras/miniaudio_split/**
  - third_party/opus-master/opus-main/tests/**
  - third_party/opus-master/opus-main/celt/tests/**
  - third_party/opus-master/opus-main/celt/opus_custom_demo.c
  - third_party/opus-master/opus-main/src/opus_compare.c
  # Opus is added with OPUS_BUILD_PROGRAMS=OFF and OPUS_BUILD_TESTING=OFF.
  # Every file below has its own main() and belongs to a program target the
  # engine never configures; none of them is part of the libopus sources.
  - third_party/opus-master/opus-main/src/extensions.c
  - third_party/opus-master/opus-main/src/opus_demo.c
  - third_party/opus-master/opus-main/src/osce_compare.c
  - third_party/opus-master/opus-main/src/qext_compare.c
  - third_party/opus-master/opus-main/src/repacketizer_demo.c
  - third_party/opus-master/opus-main/dnn/adaconvtest.c
  - third_party/opus-master/opus-main/dnn/bwe_demo.c
  - third_party/opus-master/opus-main/dnn/dred_compare.c
  - third_party/opus-master/opus-main/dnn/dump_data.c
  - third_party/opus-master/opus-main/dnn/dump_lpcnet_tables.c
  - third_party/opus-master/opus-main/dnn/fargan_demo.c
  - third_party/opus-master/opus-main/dnn/lossgen.c
  - third_party/opus-master/opus-main/dnn/lossgen_demo.c
  - third_party/opus-master/opus-main/dnn/osce.c
  - third_party/opus-master/opus-main/dnn/parse_lpcnet_weights.c
  - third_party/opus-master/opus-main/dnn/test_vec.c
  - third_party/opus-master/opus-main/dnn/write_lpcnet_weights.c
  - third_party/flatbuffers-master/flatbuffers-master/tests/**
  # HarfBuzz's upstream test executables are not built or linked by the engine.
  - third_party/harfbuzz-download/**/src/test-*.cc
  - third_party/harfbuzz-download/**/src/graph/test-*.cc
