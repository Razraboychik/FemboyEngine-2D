name: Bug report
description: Report a reproducible defect in FemboyEngine2D
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the private security
        advisory flow described in .github/SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit hash.
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - Android
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest scene, project or asset that shows the bug.
      placeholder: |
        1. Build with ...
        2. Open ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and crash data
      description: Paste the relevant log lines. Do not include secrets or private assets.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues first.
          required: true
        - label: This is not a security vulnerability.
          required: true
