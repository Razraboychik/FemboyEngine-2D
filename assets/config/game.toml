# FemboyEngine2D runtime configuration sample.
#
# `fby_fempak pack` copies this file into the archive verbatim; it is data, not
# code, so a mod can override it by mounting a pack with a higher priority.
[window]
title = "FemboyEngine2D"
width = 1600
height = 900
vsync = true

[render]
max_items_per_frame = 1048576
atlas = "atlas/atlas.toml"

[game]
start_scene = "scenes/demo.toml"
